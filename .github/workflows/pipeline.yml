name: pipeline

# Runs on every push to any branch and on every pull request to main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Builds the image of every service. A Dockerfile that does not build fails the pipeline.
  # Only a push to main publishes the image to GHCR, tagged with the commit SHA.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [content, scheduling]
    permissions:
      contents: read     # check out the code
      packages: write    # let GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/dom-potec/sdd-flashcards-${{ matrix.service }}:${{ github.sha }}
