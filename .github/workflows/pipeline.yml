name: pipeline

# Runs on every push to any branch and on every pull request to main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Lints and tests each service against a real SQL Server, and fails below 70% coverage.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # if one service fails, still show the result of the other
      matrix:
        service: [content, scheduling]
    # A throwaway SQL Server that lives only for this job. CI never touches Azure SQL.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD }}
        ports:
          - 1433:1433
        # The job's steps start only once this command succeeds inside the container.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: flake8 app tests

      - name: Test with coverage gate
        env:
          TEST_DATABASE_URL: mssql://sa:${{ secrets.CI_SA_PASSWORD }}@localhost:1433/${{ matrix.service }}_test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  # Checks the machine-readable descriptions of the system: both OpenAPI files and system.yaml.
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install -r requirements-dev.txt

      - name: Validate OpenAPI documents
        run: openapi-spec-validator services/content/openapi.yaml services/scheduling/openapi.yaml

      # system.schema.json is the professor's file, copied unchanged. This fails if system.yaml breaks
      # the schema, or if it points at a service folder, OpenAPI document or migrations folder that is missing.
      - name: Validate system.yaml against system.schema.json
        run: |
          python - <<'PY'
          import json, os, yaml
          from jsonschema import Draft202012Validator
          system = yaml.safe_load(open("system.yaml"))
          schema = json.load(open("system.schema.json"))
          errors = sorted(Draft202012Validator(schema).iter_errors(system), key=lambda e: list(e.path))
          for error in errors:
              print("/".join(map(str, error.path)) or "(root)", "-", error.message)
          assert not errors, f"{len(errors)} schema error(s) in system.yaml"
          for name, service in system["services"].items():
              for key in ("path", "openapi", "migrations"):
                  assert os.path.exists(service[key]), f"{name}.{key}: {service[key]} does not exist"
          print("system.yaml matches system.schema.json and its paths exist")
          PY

  # Builds the image of every service. A Dockerfile that does not build fails the pipeline.
  # Only a push to main publishes the image to GHCR, tagged with the commit SHA.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [content, scheduling]
    permissions:
      contents: read     # check out the code
      packages: write    # let GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false   # a plain image manifest, which Container Apps can pull from GHCR
          tags: ghcr.io/dom-potec/sdd-flashcards-${{ matrix.service }}:${{ github.sha }}

  # Starts the whole system with docker compose on the runner and tests it across the two services,
  # over real HTTP, including what happens when the content container is stopped.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --wait returns once every container is healthy, and fails the job if one never becomes healthy.
      - name: Start the stack
        run: docker compose up --build --wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install -r requirements-dev.txt

      - name: Run the integration tests
        env:
          RUN_FAILURE_TEST: "1"   # also run the test that stops the content container
        run: pytest -v

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Deployment. Runs only for a push to main, and only after every CI job above passed on this commit.
  # It changes two things on Azure: the image of each Container App and the files of the UI's storage
  # static website. Everything else was created once by infra/azure-setup.sh.
  deploy:
    needs: [test, validate-docs, images, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token that Azure trusts
      contents: read
    env:
      PREFIX: ${{ vars.PREFIX }}
      RG: ${{ vars.RESOURCE_GROUP }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
    steps:
      - uses: actions/checkout@v4

      # No stored credential: the job signs in as the managed identity <prefix>-github, which trusts
      # tokens GitHub issues for the main branch of this repository.
      - name: Log in to Azure as the pipeline's managed identity (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The images job already pushed ghcr.io/dom-potec/sdd-flashcards-<service>:<this commit>.
      # The connection string is built from the GitHub secret and stored as the app's own secret;
      # DATABASE_URL refers to it. GIT_SHA is what /health reports as "version".
      - name: Point both Container Apps at this commit's images
        env:
          CONTENT_DB_PASSWORD: ${{ secrets.CONTENT_DB_PASSWORD }}
          SCHEDULING_DB_PASSWORD: ${{ secrets.SCHEDULING_DB_PASSWORD }}
        run: |
          az extension add --name containerapp --only-show-errors
          for service in content scheduling; do
            password_var=$(echo "${service}_DB_PASSWORD" | tr a-z A-Z)
            url="mssql://${service}_user:${!password_var}@$PREFIX-sql.database.windows.net:1433/$PREFIX-$service-db"
            az containerapp secret set -n "$PREFIX-$service" -g "$RG" --secrets "database-url=$url" -o none
            az containerapp update -n "$PREFIX-$service" -g "$RG" \
              --image "ghcr.io/dom-potec/sdd-flashcards-$service:$GITHUB_SHA" \
              --set-env-vars "GIT_SHA=$GITHUB_SHA" -o none
          done

      - name: Write the services' public URLs into ui/config.js
        run: |
          fqdn() { az containerapp show -n "$PREFIX-$1" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv; }
          CONTENT_URL="https://$(fqdn content)"
          SCHEDULING_URL="https://$(fqdn scheduling)"
          printf 'window.CONFIG = {\n  CONTENT_URL: "%s",\n  SCHEDULING_URL: "%s",\n};\n' \
            "$CONTENT_URL" "$SCHEDULING_URL" > ui/config.js
          cat ui/config.js
          echo "CONTENT_URL=$CONTENT_URL" >> "$GITHUB_ENV"
          echo "SCHEDULING_URL=$SCHEDULING_URL" >> "$GITHUB_ENV"

      # $web is the container a storage static website serves. no-cache makes browsers ask again, so
      # a new config.js or app.js is used straight after a deployment.
      - name: Upload the UI to the storage static website
        run: |
          az storage blob upload-batch --account-name "$UI_STORAGE" --auth-mode key \
            --destination '$web' --source ui --overwrite --content-cache-control no-cache -o none

      # The deployment only counts if both services answer /health with this commit as their version.
      # A 200 from an old replica is not enough. Five minutes allows for a cold start: the container
      # starts, the database resumes from pause, and migrations run before the first answer.
      - name: Health gate
        run: |
          deadline=$((SECONDS + 300))
          for url in "$CONTENT_URL" "$SCHEDULING_URL"; do
            until [ "$(curl -fsS --max-time 30 "$url/health" | jq -r .version)" = "$GITHUB_SHA" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$url/health did not report version $GITHUB_SHA within 5 minutes"
                exit 1
              fi
              sleep 10
            done
            echo "$url is healthy on $GITHUB_SHA"
          done
